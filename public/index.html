<script>
const MAX_SKUS = 20;
const COOLDOWN_SEC = 90;
const UPDATE_KEY = 'lastSkuUpdate';
const PRICE_WARN_RATIO = 0.3;
const BULK_CONCURRENCY = 3;
const RECHECK_DELAY_MS = 5 * 60 * 1000;
const LATE_THRESHOLD_MS = 5 * 60 * 1000;
const HISTORY_KEY = 'priceHistory';
const HISTORY_MAX = 50;
const SORT_KEY = 'skuSortMode';
const STOCK_FILTER_KEY = 'hideZeroStock';

let results = [];
let currentFilter = 'all';
let skuData = { items: [], updated: null };
let selectedSkus = new Set();
let currentChannel = 'ALL';
let cooldownTimer = null;
let bulkSelection = new Set();
let pendingSkus = new Map();
let pendingTick = null;




// 商品ページURL生成
function buildProductUrl(asin) {
  if (!asin) return null;
  return `https://www.amazon.co.jp/dp/${encodeURIComponent(asin)}`;
}




// サムネイルHTML生成（カード用：60px、タップで別タブ）
function renderThumbCard(asin, name, imageUrl) {
  const alt = escapeHtml((name || asin || '').substring(0, 40));
  if (!asin) {
    return `<div class="thumb thumb-card"><div class="thumb-noimg">No<br>Image</div></div>`;
  }
  const productUrl = buildProductUrl(asin);
  const imgHtml = buildFallbackImg(asin, alt, imageUrl);
  return `<a class="thumb thumb-card thumb-link" href="${productUrl}" target="_blank" rel="noopener noreferrer" aria-label="Amazon商品ページを開く" onclick="event.stopPropagation()">${imgHtml}</a>`;
}

// サムネイルHTML生成（モーダル用：48px、リンクなし）
function renderThumbModal(asin, name, imageUrl) {
  const alt = escapeHtml((name || asin || '').substring(0, 40));
  if (!asin) {
    return `<div class="thumb thumb-modal"><div class="thumb-noimg">No<br>Image</div></div>`;
  }
  return `<div class="thumb thumb-modal">${buildFallbackImg(asin, alt, imageUrl)}</div>`;
}



// 画像URLの複数パターンフォールバック（imageUrl優先、推測URLフォールバック、naturalWidth判定付き）
function buildFallbackImg(asin, alt, savedImageUrl) {
  const a = encodeURIComponent(asin);
  const urls = [
    savedImageUrl, // Catalog APIから取得した本物URL（最優先）
    `https://m.media-amazon.com/images/P/${a}.09._SL160_.jpg`,
    `https://m.media-amazon.com/images/P/${a}.01._SL160_.jpg`,
    `https://images-na.ssl-images-amazon.com/images/P/${a}.01.LZZZZZZZ.jpg`,
  ].filter(Boolean);
  if (urls.length === 0) {
    return `<div class="thumb-noimg">No<br>Image</div>`;
  }
  const urlsAttr = escapeHtml(JSON.stringify(urls));
  return `<img src="${urls[0]}" alt="${alt}" loading="lazy" data-urls="${urlsAttr}" data-step="0" onload="checkThumb(this)" onerror="nextThumb(this)">`;
}
  

// 画像ロード完了時：1×1ダミーGIFを検知して次へ
function checkThumb(img) {
  if (img.naturalWidth <= 1) nextThumb(img);
}

// 次のURLに切り替え、全部失敗したらNo Image
function nextThumb(img) {
  try {
    const urls = JSON.parse(img.dataset.urls);
    const step = parseInt(img.dataset.step || '0', 10) + 1;
    if (step >= urls.length) {
      img.parentElement.innerHTML = '<div class="thumb-noimg">No<br>Image</div>';
      return;
    }
    img.dataset.step = String(step);
    img.src = urls[step];
  } catch (e) {
    img.parentElement.innerHTML = '<div class="thumb-noimg">No<br>Image</div>';
  }
}
  

  
window.addEventListener('load', () => {
  const saved = localStorage.getItem('skus');
  if (saved) {
    document.getElementById('skuInput').value = saved;
    updateInputInfo();
  }
  updateCooldownDisplay();
  document.getElementById('skuInput').addEventListener('input', updateInputInfo);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) checkPendingTimers();
  });
});

function updateInputInfo() {
  const text = document.getElementById('skuInput').value;
  const count = text.split('\n').map(s => s.trim()).filter(s => s).length;
  const info = document.getElementById('inputInfo');
  if (count > MAX_SKUS) {
    info.innerHTML = `<span style="color:#dc3545;font-weight:700">${count}件（最大${MAX_SKUS}件まで）</span>`;
  } else {
    info.textContent = `SKUを1行ずつ入力(${count}/${MAX_SKUS}件)`;
  }
}

function saveSKUs() {
  localStorage.setItem('skus', document.getElementById('skuInput').value);
  toast('💾 保存しました');
}

async function check() {
  const text = document.getElementById('skuInput').value.trim();
  if (!text) { alert('SKUを入力してください'); return; }
  const skus = text.split('\n').map(s => s.trim()).filter(s => s);
  if (skus.length > MAX_SKUS) { alert(`一度に${MAX_SKUS}件まで`); return; }

  const btn = document.getElementById('checkBtn');
  btn.disabled = true;
  btn.textContent = '取得中...';
  document.getElementById('empty').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('list').innerHTML = '<div class="loading">⏳ 取得中...</div>';
  document.getElementById('summary').innerHTML = '取得中...';
  bulkSelection.clear();
  updateBulkBar();

  try {
    const res = await fetch('/api/check', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ skus })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    results = data;
    checkPendingAgainstResults();
    render();
  } catch (e) {
    document.getElementById('list').innerHTML = `<div class="loading">❌ ${e.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '🔍 チェック';
  }
}

function render() {
  const stats = {total: 0, got: 0, lost: 0, error: 0};
  results.forEach(r => {
    stats.total++;
    if (r.status === 'error') stats.error++;
    else if (r.hasBuyBox) stats.got++;
    else stats.lost++;
  });
  document.getElementById('summary').innerHTML = `
    <div class="sum-row">
      <span class="sum-item">全${stats.total}品</span>
      <span class="sum-item got">✅獲得${stats.got}</span>
      <span class="sum-item lost">❌喪失${stats.lost}</span>
      ${stats.error > 0 ? `<span style="color:#999">⚠️エラー${stats.error}</span>` : ''}
    </div>
  `;
  let filtered = results;
  if (currentFilter === 'lost') filtered = results.filter(r => r.status === 'ok' && !r.hasBuyBox);
  else if (currentFilter === 'got') filtered = results.filter(r => r.status === 'ok' && r.hasBuyBox);
  filtered.sort((a, b) => {
    if (a.status === 'error') return 1;
    if (b.status === 'error') return -1;
    if (a.hasBuyBox !== b.hasBuyBox) return a.hasBuyBox ? 1 : -1;
    return (b.diffFromCart || 0) - (a.diffFromCart || 0);
  });
  if (filtered.length === 0) { document.getElementById('list').innerHTML = '<div class="empty">該当なし</div>'; return; }
  document.getElementById('list').innerHTML = filtered.map(r => renderCard(r)).join('');
}




function renderCard(r) {
  if (r.status === 'error') {
    return `<div class="card error" data-sku="${escapeHtml(r.sku)}"><div class="nm">${escapeHtml(r.sku)}</div><div class="meta">⚠️ ${escapeHtml(r.error || '')}</div></div>`;
  }
  const statusClass = r.hasBuyBox ? 'got' : 'lost';
  const statusText = r.hasBuyBox ? '✅獲得中' : '❌喪失';
  const diffCart = r.diffFromCart;
  let diffText = '', diffClass = '';
  if (diffCart !== null && diffCart !== undefined) {
    if (diffCart > 0) { diffText = `カート+${diffCart}円高`; diffClass = 'danger'; }
    else if (diffCart < 0) { diffText = `カート${diffCart}円安`; diffClass = 'ok'; }
    else { diffText = 'カート同額'; diffClass = 'ok'; }
  }
  const isBulkSelected = bulkSelection.has(r.sku);
  const hasCart = r.cartPrice && r.cartPrice > 0;
  const pending = pendingSkus.get(r.sku);
  const lastHistory = getLastHistoryForSku(r.sku);
  const channel = getSkuChannel(r.sku);
  const isFBM = channel === 'FBM';
  const currentStock = getSkuCurrentStock(r.sku);

  let pendingBadge = '';
  if (pending) {
    const elapsed = Date.now() - pending.requestedAt;
    const isLate = elapsed > LATE_THRESHOLD_MS;
    pendingBadge = `<span class="pending-badge ${isLate ? 'late' : ''}">${isLate ? '⚠ 反映遅延' : '⏱ 反映待ち'} (¥${pending.targetPrice.toLocaleString()})</span>`;
  }

  let historyNote = '';
  if (lastHistory) {
    const ago = formatAgo(Date.now() - lastHistory.at);
    const unit = lastHistory.type === 'stock' ? '' : '¥';
    const icon = lastHistory.type === 'stock' ? '📦' : '📜';
    historyNote = `<div class="history-note">${icon} ${ago} ${unit}${lastHistory.oldPrice.toLocaleString()} → ${unit}${lastHistory.newPrice.toLocaleString()}</div>`;
  }

  // FBM商品の在庫変更UI
  let stockEditHtml = '';
  if (isFBM) {
    const stockText = currentStock !== null ? `現在: ${currentStock}` : '現在: 不明';
    stockEditHtml = `
      <div class="stock-edit">
        <div class="stock-edit-label">📦 自己配送の在庫変更 (${stockText})</div>
        <div class="stock-edit-row">
          <button class="pbtn" onclick="askStockChange('${escapeHtml(r.sku)}')">在庫数を変更</button>
        </div>
        <div class="update-status" id="stock-status-${escapeHtml(r.sku)}" style="display:none"></div>
      </div>
    `;
  }

  return `
    <div class="card ${statusClass}" data-sku="${escapeHtml(r.sku)}">
      <div class="card-head">
        <input type="checkbox" class="card-check" ${isBulkSelected ? 'checked' : ''} onchange="toggleBulk('${escapeHtml(r.sku)}', this)">
        ${renderThumbCard(r.asin, r.name, getSkuImageUrl(r.sku))}
        <div class="card-body">
          <div class="nm">${escapeHtml(r.name || '(名称なし)')}</div>
          <div class="meta">SKU:${escapeHtml(r.sku)} / 競合:${r.competitorCount}名${channel ? ` / ${channel === 'FBA' ? 'FBA' : '自己配送'}` : ''}</div>
        </div>
      </div>
      <div class="price-grid">
        <div class="price-cell"><div class="label">自分</div><div class="value">¥${(r.myPrice||0).toLocaleString()}</div></div>
        <div class="price-cell"><div class="label">カート</div><div class="value">${r.cartPrice ? '¥'+r.cartPrice.toLocaleString() : '-'}</div></div>
        <div class="price-cell"><div class="label">最安</div><div class="value">${r.lowestPrice ? '¥'+r.lowestPrice.toLocaleString() : '-'}</div></div>
      </div>
      <div class="status-row">
        <span class="diff ${diffClass}">${diffText}</span>
        <span style="display:flex;gap:4px;flex-wrap:wrap">
          ${pendingBadge}
          <span class="status-badge ${statusClass}">${statusText}</span>
        </span>
      </div>
      ${historyNote}
      <div class="price-edit">
        <div class="price-edit-label">💰 価格変更</div>
        <div class="price-edit-row">
          <button class="pbtn" onclick="askPriceChange('${escapeHtml(r.sku)}', -50)">-50円</button>
          <button class="pbtn" onclick="askPriceChange('${escapeHtml(r.sku)}', -100)">-100円</button>
          <button class="pbtn" onclick="askPriceChange('${escapeHtml(r.sku)}', 'cart')" ${!hasCart ? 'disabled' : ''}>カート価格</button>
          <button class="pbtn" onclick="askPriceChange('${escapeHtml(r.sku)}', 'custom')">任意</button>
        </div>
        <div class="update-status" id="status-${escapeHtml(r.sku)}" style="display:none"></div>
        ${pending ? `<div class="recheck-btn-row"><button class="recheck-btn" onclick="manualRecheck('${escapeHtml(r.sku)}')">🔄 反映確認</button></div>` : ''}
      </div>
      ${stockEditHtml}
    </div>
  `;
}

  


  

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter .fbtn[data-f]').forEach(b => b.classList.toggle('active', b.dataset.f === f));
  render();
}

function askPriceChange(sku, option) {
  const r = results.find(x => x.sku === sku);
  if (!r) { toast('⚠️ 対象SKUが見つかりません'); return; }
  const current = r.myPrice || 0;
  let newPrice = 0;
  let label = '';
  if (option === -50) { newPrice = current - 50; label = '-50円'; }
  else if (option === -100) { newPrice = current - 100; label = '-100円'; }
  else if (option === 'cart') {
    if (!r.cartPrice) { toast('⚠️ カート価格が取得できていません'); return; }
    newPrice = r.cartPrice; label = 'カート価格に合わせる';
  }
  else if (option === 'custom') { showCustomPriceDialog(sku, current); return; }
  showPriceConfirmDialog([{ sku, oldPrice: current, newPrice, name: r.name }], label);
}

function showCustomPriceDialog(sku, current) {
  const r = results.find(x => x.sku === sku);
  document.getElementById('dialogTitle').textContent = '任意価格を入力';
  document.getElementById('dialogBody').innerHTML = `
    <div>SKU: <strong>${escapeHtml(sku)}</strong></div>
    <div>現在価格: ¥${current.toLocaleString()}</div>
    <input type="number" class="dialog-input" id="customPriceInput" placeholder="新しい価格（円）" min="1" max="9999999">
  `;
  document.getElementById('dialogConfirm').textContent = '確認';
  document.getElementById('dialogConfirm').onclick = () => {
    const v = parseInt(document.getElementById('customPriceInput').value, 10);
    if (!v || v <= 0) { toast('⚠️ 正しい価格を入力'); return; }
    closeDialog();
    showPriceConfirmDialog([{ sku, oldPrice: current, newPrice: v, name: r.name }], `¥${v.toLocaleString()}`);
  };
  openDialog();
  setTimeout(() => document.getElementById('customPriceInput').focus(), 100);
}

function showPriceConfirmDialog(items, label) {
  const warns = items.filter(x => x.newPrice < x.oldPrice * PRICE_WARN_RATIO);
  const invalids = items.filter(x => x.newPrice <= 0);
  if (invalids.length > 0) { toast(`⚠️ ${invalids.length}件が0円以下。中止`); return; }
  const isBulk = items.length > 1;
  document.getElementById('dialogTitle').textContent = isBulk ? `一括価格変更 (${items.length}件)` : '価格変更の確認';
  let html = '';
  if (isBulk) {
    html = `
      <div>変更内容: <strong>${escapeHtml(label)}</strong></div>
      <div style="max-height:200px;overflow-y:auto;margin:10px 0;font-size:12px">
        ${items.map(x => `<div style="padding:4px 0;border-bottom:1px solid #eee">${escapeHtml(x.sku)}: ¥${x.oldPrice.toLocaleString()} → <strong style="color:#dc3545">¥${x.newPrice.toLocaleString()}</strong></div>`).join('')}
      </div>
    `;
  } else {
    const x = items[0];
    html = `
      <div>SKU: <strong>${escapeHtml(x.sku)}</strong></div>
      <div style="font-size:12px;color:#666;margin:4px 0">${escapeHtml((x.name||'').substring(0,40))}</div>
      <div class="diff-preview">
        <span class="old">¥${x.oldPrice.toLocaleString()}</span>
        <span class="new">¥${x.newPrice.toLocaleString()}</span>
      </div>
    `;
  }
  if (warns.length > 0) html += `<div class="dialog-warn">⚠️ ${warns.length}件が現在価格の30%以下。本当に実行しますか？</div>`;
  document.getElementById('dialogBody').innerHTML = html;
  document.getElementById('dialogConfirm').textContent = '実行';
  document.getElementById('dialogConfirm').onclick = async () => { closeDialog(); await executePriceChange(items); };
  openDialog();
}

async function executePriceChange(items) {
  const total = items.length;
  let done = 0, okCount = 0, errCount = 0;

  const pb = document.getElementById('progressBar');
  pb.classList.remove('done');
  pb.classList.add('show');
  pb.textContent = `処理中: 0/${total}完了`;

  items.forEach(x => {
    const card = document.querySelector(`.card[data-sku="${CSS.escape(x.sku)}"]`);
    if (card) card.classList.add('updating');
    const st = document.getElementById(`status-${x.sku}`);
    if (st) { st.style.display = 'block'; st.className = 'update-status pending'; st.textContent = '⏳ 変更中...'; }
  });

  const queue = [...items];
  const results2 = [];
  const workers = Array(Math.min(BULK_CONCURRENCY, queue.length)).fill(null).map(async () => {
    while (queue.length > 0) {
      const x = queue.shift();
      try {
        const res = await fetch('/api/price-update', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ sku: x.sku, newPrice: x.newPrice })
        });
        const data = await res.json();
        results2.push({ ...x, ...data });
        done++;
        if (data.ok) {
          okCount++;
          addHistory({ at: Date.now(), sku: x.sku, oldPrice: x.oldPrice, newPrice: x.newPrice, name: x.name, ok: true, submissionId: data.submissionId });
          registerPending(x.sku, x.newPrice);
        } else {
          errCount++;
          addHistory({ at: Date.now(), sku: x.sku, oldPrice: x.oldPrice, newPrice: x.newPrice, name: x.name, ok: false, error: data.error });
        }
        const st = document.getElementById(`status-${x.sku}`);
        if (st) {
          if (data.ok) { st.className = 'update-status ok'; st.textContent = `✅ 変更受付 (¥${x.newPrice.toLocaleString()}) 5分後に自動確認`; }
          else { st.className = 'update-status err'; st.textContent = `❌ ${(data.error || 'エラー').substring(0, 60)}`; }
        }
      } catch (e) {
        done++; errCount++;
        results2.push({ ...x, ok: false, error: e.message });
        addHistory({ at: Date.now(), sku: x.sku, oldPrice: x.oldPrice, newPrice: x.newPrice, name: x.name, ok: false, error: e.message });
        const st = document.getElementById(`status-${x.sku}`);
        if (st) { st.className = 'update-status err'; st.textContent = `❌ ${e.message}`; }
      }
      pb.textContent = `処理中: ${done}/${total}完了 ✅${okCount} ❌${errCount}`;
    }
  });
  await Promise.all(workers);

  items.forEach(x => {
    const card = document.querySelector(`.card[data-sku="${CSS.escape(x.sku)}"]`);
    if (card) card.classList.remove('updating');
  });

  pb.classList.add('done');
  pb.textContent = `✅ 完了: ${okCount}件成功 / ${errCount}件失敗`;
  setTimeout(() => pb.classList.remove('show'), 3000);

  toast(`完了: ✅${okCount}件 ❌${errCount}件`);
  bulkSelection.clear();
  updateBulkBar();
  render();
}

function registerPending(sku, targetPrice) {
  const existing = pendingSkus.get(sku);
  if (existing && existing.timerId) clearTimeout(existing.timerId);
  const timerId = setTimeout(() => { autoRecheckPending(sku); }, RECHECK_DELAY_MS);
  pendingSkus.set(sku, { targetPrice, requestedAt: Date.now(), timerId });
  startPendingTick();
}

function startPendingTick() {
  if (pendingTick) return;
  pendingTick = setInterval(() => {
    if (pendingSkus.size === 0) { clearInterval(pendingTick); pendingTick = null; return; }
    const now = Date.now();
    let hasChange = false;
    pendingSkus.forEach((p, sku) => {
      const elapsed = now - p.requestedAt;
      if (!p.lateMarked && elapsed > LATE_THRESHOLD_MS) { p.lateMarked = true; hasChange = true; }
    });
    if (hasChange) render();
  }, 10000);
}

async function autoRecheckPending(sku) {
  const pending = pendingSkus.get(sku);
  if (!pending) return;
  if (!results.find(r => r.sku === sku)) { pendingSkus.delete(sku); return; }
  try {
    const res = await fetch('/api/check', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ skus: [sku] })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    if (data[0]) {
      const idx = results.findIndex(r => r.sku === sku);
      if (idx >= 0) results[idx] = data[0];
      if (data[0].myPrice === pending.targetPrice) {
        pendingSkus.delete(sku);
        toast(`✅ ${sku} 反映確認`);
      } else {
        toast(`⏳ ${sku} まだ反映されていません`);
      }
      render();
    }
  } catch (e) {
    toast(`⚠️ ${sku} 再チェック失敗: ${e.message}`);
  }
}

async function manualRecheck(sku) {
  const pending = pendingSkus.get(sku);
  if (!pending) { toast('⚠️ 反映待ち対象ではありません'); return; }
  await autoRecheckPending(sku);
}

function checkPendingAgainstResults() {
  let settled = 0;
  pendingSkus.forEach((p, sku) => {
    const r = results.find(x => x.sku === sku);
    if (r && r.myPrice === p.targetPrice) {
      if (p.timerId) clearTimeout(p.timerId);
      pendingSkus.delete(sku);
      settled++;
    }
  });
  if (settled > 0) toast(`✅ ${settled}件の反映を確認`);
}

function checkPendingTimers() {
  const now = Date.now();
  pendingSkus.forEach((p, sku) => {
    const elapsed = now - p.requestedAt;
    if (elapsed > RECHECK_DELAY_MS + 10000) {
      if (p.timerId) clearTimeout(p.timerId);
      p.timerId = null;
      autoRecheckPending(sku);
    }
  });
}

function addHistory(entry) {
  const list = loadHistory();
  list.unshift(entry);
  if (list.length > HISTORY_MAX) list.length = HISTORY_MAX;
  localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
}

function loadHistory() {
  try { const raw = localStorage.getItem(HISTORY_KEY); return raw ? JSON.parse(raw) : []; } catch { return []; }
}

function getLastHistoryForSku(sku) {
  const list = loadHistory();
  return list.find(h => h.sku === sku && h.ok) || null;
}

function openHistory() { document.getElementById('historyModal').classList.add('show'); renderHistory(); }
function closeHistory() { document.getElementById('historyModal').classList.remove('show'); }

function clearHistory() {
  if (!confirm('履歴を全削除しますか？')) return;
  localStorage.removeItem(HISTORY_KEY);
  renderHistory();
  toast('🗑 履歴を削除しました');
}

function renderHistory() {
  const list = loadHistory();
  const container = document.getElementById('historyList');
  if (list.length === 0) { container.innerHTML = '<div class="empty">履歴がありません</div>'; return; }
  container.innerHTML = list.map(h => {
    const d = new Date(h.at);
    const timeStr = `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
    const okMark = h.ok ? '✅' : '❌';
    return `
      <div class="history-item ${h.ok ? '' : 'failed'}">
        <div class="hi-time">${timeStr} ${okMark}</div>
        <div class="hi-sku">${escapeHtml(h.sku)}</div>
        <div style="font-size:11px;color:#666;margin:2px 0">${escapeHtml((h.name||'').substring(0,40))}</div>
        <div class="hi-change">
          <span class="old">¥${h.oldPrice.toLocaleString()}</span>
          <span class="new">¥${h.newPrice.toLocaleString()}</span>
        </div>
        ${!h.ok ? `<div style="font-size:11px;color:#dc3545;margin-top:4px">${escapeHtml((h.error||'').substring(0,80))}</div>` : ''}
      </div>
    `;
  }).join('');
}

function formatAgo(ms) {
  const sec = Math.floor(ms / 1000);
  if (sec < 60) return `${sec}秒前`;
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min}分前`;
  const hour = Math.floor(min / 60);
  if (hour < 24) return `${hour}時間前`;
  const day = Math.floor(hour / 24);
  return `${day}日前`;
}

function toggleBulk(sku, cb) {
  if (cb.checked) bulkSelection.add(sku);
  else bulkSelection.delete(sku);
  updateBulkBar();
}

function updateBulkBar() {
  const bar = document.getElementById('bulkBar');
  const count = bulkSelection.size;
  document.getElementById('bulkCount').textContent = count;
  bar.classList.toggle('show', count > 0);
}

function clearBulkSelection() {
  bulkSelection.clear();
  document.querySelectorAll('.card-check').forEach(cb => cb.checked = false);
  updateBulkBar();
}

function bulkPriceChange(option) {
  if (bulkSelection.size === 0) { toast('⚠️ SKUを選択してください'); return; }
  const targets = Array.from(bulkSelection).map(sku => results.find(r => r.sku === sku)).filter(r => r && r.status === 'ok');
  if (targets.length === 0) { toast('⚠️ 有効なSKUなし'); return; }
  if (option === 'custom') {
    document.getElementById('dialogTitle').textContent = '一括任意価格入力';
    document.getElementById('dialogBody').innerHTML = `
      <div>${targets.length}件を同じ価格に変更します</div>
      <input type="number" class="dialog-input" id="customBulkInput" placeholder="新しい価格（円）" min="1" max="9999999">
    `;
    document.getElementById('dialogConfirm').textContent = '確認';
    document.getElementById('dialogConfirm').onclick = () => {
      const v = parseInt(document.getElementById('customBulkInput').value, 10);
      if (!v || v <= 0) { toast('⚠️ 正しい価格を入力'); return; }
      closeDialog();
      const items = targets.map(r => ({ sku: r.sku, oldPrice: r.myPrice, newPrice: v, name: r.name }));
      showPriceConfirmDialog(items, `¥${v.toLocaleString()}`);
    };
    openDialog();
    setTimeout(() => document.getElementById('customBulkInput').focus(), 100);
    return;
  }
  let items = [];
  let label = '';
  if (option === -50) { items = targets.map(r => ({ sku: r.sku, oldPrice: r.myPrice, newPrice: r.myPrice - 50, name: r.name })); label = '-50円'; }
  else if (option === -100) { items = targets.map(r => ({ sku: r.sku, oldPrice: r.myPrice, newPrice: r.myPrice - 100, name: r.name })); label = '-100円'; }
  else if (option === 'cart') {
    const withCart = targets.filter(r => r.cartPrice);
    if (withCart.length === 0) { toast('⚠️ カート価格取得済み商品なし'); return; }
    items = withCart.map(r => ({ sku: r.sku, oldPrice: r.myPrice, newPrice: r.cartPrice, name: r.name }));
    label = 'カート価格に合わせる';
    if (withCart.length < targets.length) toast(`⚠️ カート不明の${targets.length - withCart.length}件はスキップ`);
  }
  showPriceConfirmDialog(items, label);
}

async function updateSkuList() {
  const remain = getCooldownRemain();
  if (remain > 0) { toast(`⏳ あと${formatSec(remain)}お待ちください`); return; }
  const btn = document.getElementById('updateBtn');
  btn.disabled = true;
  btn.textContent = '📝 レポート生成依頼中...';
  try {
    const createRes = await fetch('/api/report-create', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ reportType: 'ALL' })
    });
    const createData = await createRes.json();
    if (!createData.reportId) throw new Error(createData.error || 'reportId取得失敗');
    const reportId = createData.reportId;
    localStorage.setItem(UPDATE_KEY, Date.now().toString());
    let attempts = 0;
    const maxAttempts = 10;
    let reportDone = false;
    while (attempts < maxAttempts) {
      attempts++;
      btn.textContent = `⏳ 生成中... (${attempts}/${maxAttempts})`;
      await sleep(30000);
      const checkRes = await fetch(`/api/report-check?id=${encodeURIComponent(reportId)}`);
      const checkData = await checkRes.json();
      if (checkData.status === 'DONE') {
        toast(`✅ ${checkData.count}件取得完了`);
        reportDone = true;
        break;
      }
      if (checkData.status === 'FAILED') throw new Error(checkData.error || 'レポート生成失敗');
    }
    if (!reportDone) throw new Error('タイムアウト（5分経過）');

    // 画像URL取得（バックグラウンド処理）
    await fetchAllImages(btn);
  } catch (e) { alert('❌ 更新失敗: ' + e.message); }
  finally { btn.disabled = false; updateCooldownDisplay(); }
}

// 全バッチの画像URLを順次取得
async function fetchAllImages(btn) {
  let batchIndex = 0;
  let totalFetched = 0;
  let totalBatches = 0;
  const maxBatches = 30; // 安全マージン
  try {
    while (batchIndex < maxBatches) {
      btn.textContent = `🖼 画像取得中... (${batchIndex + 1}${totalBatches ? '/' + totalBatches : ''})`;
      const res = await fetch('/api/image-fetch', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ batchIndex })
      });
      const data = await res.json();
      if (!data.ok) {
        console.warn('画像取得エラー:', data.error);
        break; // エラーでも処理続行（画像なしでも表示可能）
      }
      totalBatches = data.totalBatches || totalBatches;
      totalFetched += data.fetched || 0;
      if (data.done || data.nextBatch === null) {
        toast(`🖼 画像URL ${totalFetched}件取得完了`);
        break;
      }
      batchIndex = data.nextBatch;
      // SP-APIレート制限（2 req/sec）対応: 600ms待機
      await sleep(600);
    }
  } catch (e) {
    console.warn('画像取得で例外:', e);
    toast(`⚠️ 画像取得途中で停止 (${totalFetched}件取得済み)`);
  }
}

  

  
function getCooldownRemain() {
  const last = parseInt(localStorage.getItem(UPDATE_KEY) || '0', 10);
  if (!last) return 0;
  return Math.max(0, COOLDOWN_SEC - Math.floor((Date.now() - last) / 1000));
}

function formatSec(sec) { const m = Math.floor(sec / 60); const s = sec % 60; return `${m}:${s.toString().padStart(2, '0')}`; }

function updateCooldownDisplay() {
  if (cooldownTimer) clearInterval(cooldownTimer);
  const btn = document.getElementById('updateBtn');
  const tick = () => {
    const remain = getCooldownRemain();
    if (remain > 0) { btn.textContent = `🔄 更新 (残り${formatSec(remain)})`; btn.disabled = true; }
    else {
      btn.textContent = '🔄 SKU一覧を更新'; btn.disabled = false;
      if (cooldownTimer) { clearInterval(cooldownTimer); cooldownTimer = null; }
    }
  };
  tick();
  if (getCooldownRemain() > 0) cooldownTimer = setInterval(tick, 1000);
}

function renderSkuList() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const sortMode = document.getElementById('sortSelect').value;
  localStorage.setItem(SORT_KEY, sortMode);

  let items = (skuData.items || []).slice(); // 元配列を変更しないようコピー

  if (currentChannel !== 'ALL') items = items.filter(s => s.channel === currentChannel);
  if (q) items = items.filter(s =>
    (s.sku || '').toLowerCase().includes(q) ||
    (s.asin || '').toLowerCase().includes(q) ||
    (s.name || '').toLowerCase().includes(q)
  );
    // 在庫0除外フィルタ（既選択は維持）
  const hideZero = document.getElementById('hideZeroStock').checked;
  localStorage.setItem(STOCK_FILTER_KEY, hideZero ? 'true' : 'false');
  if (hideZero) {
    items = items.filter(s => (s.quantity || 0) > 0 || selectedSkus.has(s.sku));
  }

  // ソート処理
  items.sort((a, b) => {
    if (sortMode === 'dateDesc') {
      // 新しい順（openDateが新しいものが上）、nullは最後
      if (!a.openDate && !b.openDate) return 0;
      if (!a.openDate) return 1;
      if (!b.openDate) return -1;
      return b.openDate.localeCompare(a.openDate);
    }
    if (sortMode === 'dateAsc') {
      // 古い順
      if (!a.openDate && !b.openDate) return 0;
      if (!a.openDate) return 1;
      if (!b.openDate) return -1;
      return a.openDate.localeCompare(b.openDate);
    }
    if (sortMode === 'stockDesc') {
      // 在庫数 多い順。同数ならSKU昇順
      const diff = (b.quantity || 0) - (a.quantity || 0);
      if (diff !== 0) return diff;
      return (a.sku || '').localeCompare(b.sku || '');
    }
    // default: SKU順
    return (a.sku || '').localeCompare(b.sku || '');
  });

  document.getElementById('filterCount').textContent = `${items.length}件表示`;
  if (items.length === 0) { document.getElementById('modalList').innerHTML = '<div class="empty">該当なし</div>'; return; }
  const atLimit = selectedSkus.size >= MAX_SKUS;
  document.getElementById('modalList').innerHTML = items.map(s => {
    const isSelected = selectedSkus.has(s.sku);
    const disabled = !isSelected && atLimit;
    const name = (s.name || '(名称なし)').substring(0, 40);
    const dateStr = formatOpenDate(s.openDate);
    const stockClass = (s.quantity || 0) === 0 ? 'zero' : '';
    return `
      <label class="sku-row ${isSelected ? 'selected' : ''} ${disabled ? 'disabled' : ''}">
        <input type="checkbox" class="sku-check" ${isSelected ? 'checked' : ''} ${disabled ? 'disabled' : ''} data-sku="${escapeHtml(s.sku)}" onchange="toggleSku(this)">

        ${renderThumbModal(s.asin, s.name, s.imageUrl)}
        
        <div class="sku-body">
          <div class="sku-top">
            <span class="sku-code">${escapeHtml(s.sku)}</span>
            <span class="sku-badge ${s.channel}">${s.channel === 'FBA' ? 'FBA' : '自己'}</span>
            <button type="button" class="copy-sku-btn" data-sku="${escapeHtml(s.sku)}" onclick="copySku(event, this.dataset.sku)" aria-label="SKUをコピー">📋</button>
            <button type="button" class="copy-sku-btn" data-sku="${escapeHtml(s.sku)}" onclick="copySku(event, this.dataset.sku)" aria-label="SKUをコピー">📋</button>
          </div>
          <div class="sku-name">${escapeHtml(name)}</div>
          <div class="sku-meta">
            <span class="mi">¥${(s.price || 0).toLocaleString()}</span>
            <span class="mi mi-stock ${stockClass}">📦 ${s.quantity || 0}</span>
            ${dateStr ? `<span class="mi mi-date">📅 ${dateStr}</span>` : ''}
          </div>
        </div>
      </label>
    `;
  }).join('');
}

function formatOpenDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    const yy = String(d.getFullYear()).slice(2);
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yy}/${mm}/${dd}`;
  } catch { return ''; }
}



// SKUをクリップボードにコピー
async function copySku(event, sku) {
  if (event) { event.preventDefault(); event.stopPropagation(); }
  if (!sku) { toast('⚠️ SKUが取得できません'); return; }
  try {
    await navigator.clipboard.writeText(sku);
    toast(`📋 ${sku} をコピー`);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = sku; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(`📋 ${sku} をコピー`); }
    catch { toast('⚠️ コピー失敗'); }
    document.body.removeChild(ta);
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
