<body>

<div class="header">
  <h1>🔍 Amazon価格チェッカー</h1>
</div>

<div class="control">
  <textarea class="sku-input" id="skuInput" placeholder="SKUを1行ずつ入力&#10;例:&#10;ABC-001&#10;ABC-002"></textarea>
  <div class="sku-info" id="inputInfo">SKUを1行ずつ入力(最大20件)</div>
  <div class="btn-row">
    <button class="btn btn-secondary" onclick="saveSKUs()">💾 保存</button>
    <button class="btn btn-primary" id="checkBtn" onclick="check()">🔍 チェック</button>
  </div>
  <div class="btn-row-2">
    <button class="btn btn-tertiary" id="updateBtn" onclick="updateSkuList()">🔄 SKU一覧を更新</button>
    <button class="btn btn-tertiary" onclick="openSelector()">📋 一覧から選択</button>
  </div>
</div>

<div id="result" style="display:none">
  <div class="summary" id="summary"></div>
  <div class="filter">
    <button class="fbtn active" data-f="all" onclick="setFilter('all')">全て</button>
    <button class="fbtn" data-f="lost" onclick="setFilter('lost')">❌喪失</button>
    <button class="fbtn" data-f="got" onclick="setFilter('got')">✅獲得</button>
  </div>
  <div class="list" id="list"></div>
</div>

<div id="empty" class="empty">
  👆 上にSKUを入力して「チェック」を押してください
</div>

<!-- ===== SKU選択モーダル ===== -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <button class="modal-close" onclick="closeSelector()">✕</button>
      <h2>📋 SKU一覧から選択</h2>
    </div>
    <div class="update-info" id="updateInfo" style="display:none"></div>
    <div class="modal-controls">
      <input type="text" class="modal-search" id="searchInput" placeholder="🔍 SKU・ASIN・商品名で検索" oninput="renderSkuList()">
      <div class="modal-counter">
        <span>選択中: <span class="counter-val" id="counter">0/20</span></span>
        <span id="filterCount"></span>
      </div>
      <div class="filter" style="padding:0">
        <button class="fbtn active" data-ch="ALL" onclick="setChannel('ALL')">全て</button>
        <button class="fbtn" data-ch="FBA" onclick="setChannel('FBA')">FBA</button>
        <button class="fbtn" data-ch="FBM" onclick="setChannel('FBM')">自己発送</button>
      </div>
    </div>
    <div class="modal-list" id="modalList">
      <div class="loading">⏳ 読み込み中...</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeSelector()">キャンセル</button>
      <button class="btn btn-primary" id="applyBtn" onclick="applySelection()">✅ 追加</button>
    </div>
  </div>
</div>

<script>
// ===== 既存機能 =====
let results = [];
let currentFilter = 'all';

// ===== SKU選択機能 =====
const MAX_SKUS = 20;
const COOLDOWN_SEC = 90;
const UPDATE_KEY = 'lastSkuUpdate';
let skuData = { items: [], updated: null };
let selectedSkus = new Set();
let currentChannel = 'ALL';
let cooldownTimer = null;

window.addEventListener('load', () => {
  const saved = localStorage.getItem('skus');
  if (saved) {
    document.getElementById('skuInput').value = saved;
    updateInputInfo();
  }
  updateCooldownDisplay();
  document.getElementById('skuInput').addEventListener('input', updateInputInfo);
});

function updateInputInfo() {
  const text = document.getElementById('skuInput').value;
  const count = text.split('\n').map(s => s.trim()).filter(s => s).length;
  const info = document.getElementById('inputInfo');
  if (count > MAX_SKUS) {
    info.innerHTML = `<span style="color:#dc3545;font-weight:700">${count}件（最大${MAX_SKUS}件まで）</span>`;
  } else {
    info.textContent = `SKUを1行ずつ入力(${count}/${MAX_SKUS}件)`;
  }
}

function saveSKUs() {
  localStorage.setItem('skus', document.getElementById('skuInput').value);
  toast('💾 保存しました');
}

async function check() {
  const text = document.getElementById('skuInput').value.trim();
  if (!text) { alert('SKUを入力してください'); return; }

  const skus = text.split('\n').map(s => s.trim()).filter(s => s);
  if (skus.length > MAX_SKUS) { alert(`一度に${MAX_SKUS}件まで`); return; }

  const btn = document.getElementById('checkBtn');
  btn.disabled = true;
  btn.textContent = '取得中...';
  document.getElementById('empty').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('list').innerHTML = '<div class="loading">⏳ 取得中...</div>';
  document.getElementById('summary').innerHTML = '取得中...';

  try {
    const res = await fetch('/api/check', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ skus })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    results = data;
    render();
  } catch (e) {
    document.getElementById('list').innerHTML = `<div class="loading">❌ ${e.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '🔍 チェック';
  }
}

function render() {
  const stats = {total: 0, got: 0, lost: 0, error: 0};
  results.forEach(r => {
    stats.total++;
    if (r.status === 'error') stats.error++;
    else if (r.hasBuyBox) stats.got++;
    else stats.lost++;
  });

  document.getElementById('summary').innerHTML = `
    <div class="sum-row">
      <span class="sum-item">全${stats.total}品</span>
      <span class="sum-item got">✅獲得${stats.got}</span>
      <span class="sum-item lost">❌喪失${stats.lost}</span>
      ${stats.error > 0 ? `<span style="color:#999">⚠️エラー${stats.error}</span>` : ''}
    </div>
  `;

  let filtered = results;
  if (currentFilter === 'lost') filtered = results.filter(r => r.status === 'ok' && !r.hasBuyBox);
  else if (currentFilter === 'got') filtered = results.filter(r => r.status === 'ok' && r.hasBuyBox);

  filtered.sort((a, b) => {
    if (a.status === 'error') return 1;
    if (b.status === 'error') return -1;
    if (a.hasBuyBox !== b.hasBuyBox) return a.hasBuyBox ? 1 : -1;
    return (b.diffFromCart || 0) - (a.diffFromCart || 0);
  });

  if (filtered.length === 0) {
    document.getElementById('list').innerHTML = '<div class="empty">該当なし</div>';
    return;
  }

  document.getElementById('list').innerHTML = filtered.map(r => {
    if (r.status === 'error') {
      return `<div class="card error"><div class="nm">${r.sku}</div><div class="meta">⚠️ ${r.error}</div></div>`;
    }
    const statusClass = r.hasBuyBox ? 'got' : 'lost';
    const statusText = r.hasBuyBox ? '✅獲得中' : '❌喪失';
    const diffCart = r.diffFromCart;
    let diffText = '', diffClass = '';
    if (diffCart !== null) {
      if (diffCart > 0) { diffText = `カート+${diffCart}円高`; diffClass = 'danger'; }
      else if (diffCart < 0) { diffText = `カート${diffCart}円安`; diffClass = 'ok'; }
      else { diffText = 'カート同額'; diffClass = 'ok'; }
    }
    return `
      <div class="card ${statusClass}">
        <div class="nm">${escapeHtml(r.name || '(名称なし)')}</div>
        <div class="meta">SKU:${escapeHtml(r.sku)} / 競合:${r.competitorCount}名</div>
        <div class="price-grid">
          <div class="price-cell"><div class="label">自分</div><div class="value">¥${(r.myPrice||0).toLocaleString()}</div></div>
          <div class="price-cell"><div class="label">カート</div><div class="value">${r.cartPrice ? '¥'+r.cartPrice.toLocaleString() : '-'}</div></div>
          <div class="price-cell"><div class="label">最安</div><div class="value">${r.lowestPrice ? '¥'+r.lowestPrice.toLocaleString() : '-'}</div></div>
        </div>
        <div class="status-row">
          <span class="diff ${diffClass}">${diffText}</span>
          <span class="status-badge ${statusClass}">${statusText}</span>
        </div>
      </div>
    `;
  }).join('');
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter .fbtn[data-f]').forEach(b => b.classList.toggle('active', b.dataset.f === f));
  render();
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ===== SKU一覧更新（Reports API → KV） =====
async function updateSkuList() {
  const remain = getCooldownRemain();
  if (remain > 0) {
    toast(`⏳ あと${formatSec(remain)}お待ちください`);
    return;
  }

  const btn = document.getElementById('updateBtn');
  btn.disabled = true;
  btn.textContent = '📝 レポート生成依頼中...';

  try {
    // 1. レポート生成依頼
    const createRes = await fetch('/api/report-create', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ reportType: 'ALL' })
    });
    const createData = await createRes.json();
    if (!createData.reportId) throw new Error(createData.error || 'reportId取得失敗');
    const reportId = createData.reportId;

    // クールダウン開始（レポート生成リクエストした時点でSP-APIを消費）
    localStorage.setItem(UPDATE_KEY, Date.now().toString());

    // 2. ポーリング（30秒間隔、最大10回=5分）
    let attempts = 0;
    const maxAttempts = 10;
    while (attempts < maxAttempts) {
      attempts++;
      btn.textContent = `⏳ 生成中... (${attempts}/${maxAttempts})`;
      await sleep(30000);

      const checkRes = await fetch(`/api/report-check?id=${encodeURIComponent(reportId)}`);
      const checkData = await checkRes.json();

      if (checkData.status === 'DONE') {
        toast(`✅ ${checkData.count}件取得完了`);
        break;
      }
      if (checkData.status === 'FAILED') {
        throw new Error(checkData.error || 'レポート生成失敗');
      }
      // IN_PROGRESS なら続行
    }

    if (attempts >= maxAttempts) {
      throw new Error('タイムアウト（5分経過）');
    }
  } catch (e) {
    alert('❌ 更新失敗: ' + e.message);
  } finally {
    btn.disabled = false;
    updateCooldownDisplay();
  }
}

// ===== クールダウン表示 =====
function getCooldownRemain() {
  const last = parseInt(localStorage.getItem(UPDATE_KEY) || '0', 10);
  if (!last) return 0;
  const elapsed = Math.floor((Date.now() - last) / 1000);
  return Math.max(0, COOLDOWN_SEC - elapsed);
}

function formatSec(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function updateCooldownDisplay() {
  if (cooldownTimer) clearInterval(cooldownTimer);
  const btn = document.getElementById('updateBtn');

  const tick = () => {
    const remain = getCooldownRemain();
    if (remain > 0) {
      btn.textContent = `🔄 更新 (残り${formatSec(remain)})`;
      btn.disabled = true;
    } else {
      btn.textContent = '🔄 SKU一覧を更新';
      btn.disabled = false;
      if (cooldownTimer) { clearInterval(cooldownTimer); cooldownTimer = null; }
    }
  };
  tick();
  if (getCooldownRemain() > 0) {
    cooldownTimer = setInterval(tick, 1000);
  }
}

// ===== SKU選択モーダル =====
async function openSelector() {
  document.getElementById('modal').classList.add('show');
  selectedSkus = new Set();
  currentChannel = 'ALL';
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('.fbtn[data-ch]').forEach(b => b.classList.toggle('active', b.dataset.ch === 'ALL'));
  document.getElementById('modalList').innerHTML = '<div class="loading">⏳ 読み込み中...</div>';

  // 既に入力欄にあるSKUをプリセレクト
  const existing = document.getElementById('skuInput').value.split('\n').map(s => s.trim()).filter(s => s);
  existing.forEach(s => selectedSkus.add(s));

  try {
    const res = await fetch('/api/sku-list');
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'SKU一覧取得失敗');
    skuData = data;

    if (data.updated) {
      const d = new Date(data.updated);
      document.getElementById('updateInfo').style.display = 'block';
      document.getElementById('updateInfo').textContent = `📅 最終更新: ${d.toLocaleString('ja-JP')}`;
    }

    renderSkuList();
    updateCounter();
  } catch (e) {
    document.getElementById('modalList').innerHTML = `<div class="loading">❌ ${e.message}<br><br>先に「🔄 SKU一覧を更新」を実行してください</div>`;
  }
}

function closeSelector() {
  document.getElementById('modal').classList.remove('show');
}

function setChannel(ch) {
  currentChannel = ch;
  document.querySelectorAll('.fbtn[data-ch]').forEach(b => b.classList.toggle('active', b.dataset.ch === ch));
  renderSkuList();
}

function renderSkuList() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let items = skuData.items || [];

  if (currentChannel !== 'ALL') {
    items = items.filter(s => s.channel === currentChannel);
  }
  if (q) {
    items = items.filter(s =>
      (s.sku || '').toLowerCase().includes(q) ||
      (s.asin || '').toLowerCase().includes(q) ||
      (s.name || '').toLowerCase().includes(q)
    );
  }

  document.getElementById('filterCount').textContent = `${items.length}件表示`;

  if (items.length === 0) {
    document.getElementById('modalList').innerHTML = '<div class="empty">該当なし</div>';
    return;
  }

  const atLimit = selectedSkus.size >= MAX_SKUS;

  document.getElementById('modalList').innerHTML = items.map(s => {
    const isSelected = selectedSkus.has(s.sku);
    const disabled = !isSelected && atLimit;
    const name = (s.name || '(名称なし)').substring(0, 40);
    return `
      <label class="sku-row ${isSelected ? 'selected' : ''} ${disabled ? 'disabled' : ''}">
        <input type="checkbox" class="sku-check"
          ${isSelected ? 'checked' : ''} ${disabled ? 'disabled' : ''}
          data-sku="${escapeHtml(s.sku)}" onchange="toggleSku(this)">
        <div class="sku-body">
          <div class="sku-top">
            <span class="sku-code">${escapeHtml(s.sku)}</span>
            <span class="sku-badge ${s.channel}">${s.channel === 'FBA' ? 'FBA' : '自己'}</span>
          </div>
          <div class="sku-name">${escapeHtml(name)}</div>
          <div class="sku-price">¥${(s.price || 0).toLocaleString()}</div>
        </div>
      </label>
    `;
  }).join('');
}

function toggleSku(cb) {
  const sku = cb.dataset.sku;
  if (cb.checked) {
    if (selectedSkus.size >= MAX_SKUS) {
      cb.checked = false;
      toast(`⚠️ 最大${MAX_SKUS}件までです`);
      return;
    }
    selectedSkus.add(sku);
  } else {
    selectedSkus.delete(sku);
  }
  updateCounter();
  // 上限到達時は未選択項目をdisableに（再描画）
  const wasAtLimit = selectedSkus.size >= MAX_SKUS;
  const prevAtLimit = document.querySelector('.sku-row.disabled') !== null;
  if (wasAtLimit !== prevAtLimit) {
    renderSkuList();
  } else {
    // 選択状態のクラスだけ更新
    cb.closest('.sku-row').classList.toggle('selected', cb.checked);
  }
}

function updateCounter() {
  const counter = document.getElementById('counter');
  counter.textContent = `${selectedSkus.size}/${MAX_SKUS}`;
  counter.classList.toggle('warn', selectedSkus.size >= MAX_SKUS);
}

function applySelection() {
  if (selectedSkus.size === 0) {
    toast('⚠️ SKUを選択してください');
    return;
  }
  const skus = Array.from(selectedSkus);
  document.getElementById('skuInput').value = skus.join('\n');
  updateInputInfo();
  closeSelector();
  toast(`✅ ${skus.length}件を適用`);
}

// ===== ユーティリティ =====
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function toast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}
</script>
