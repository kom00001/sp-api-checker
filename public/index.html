<body>

<div class="header">
  <h1>🔍 Amazon価格チェッカー</h1>
</div>

<div class="control">
  <textarea class="sku-input" id="skuInput" placeholder="SKUを1行ずつ入力&#10;例:&#10;ABC-001&#10;ABC-002"></textarea>
  <div class="sku-info" id="inputInfo">SKUを1行ずつ入力(最大20件)</div>
  <div class="btn-row">
    <button class="btn btn-secondary" onclick="saveSKUs()">💾 保存</button>
    <button class="btn btn-primary" id="checkBtn" onclick="check()">🔍 チェック</button>
  </div>
  <div class="btn-row-2">
    <button class="btn btn-tertiary" id="updateBtn" onclick="updateSkuList()">🔄 SKU一覧を更新</button>
    <button class="btn btn-tertiary" onclick="openSelector()">📋 一覧から選択</button>
  </div>
</div>

<div id="result" style="display:none">
  <div class="summary" id="summary"></div>
  <div class="bulk-bar" id="bulkBar">
    <div class="bulk-count">☑️ 選択中: <span class="n" id="bulkCount">0</span>件 を一括値下げ</div>
    <div class="bulk-row">
      <button class="pbtn" onclick="bulkPriceChange(-50)">-50円</button>
      <button class="pbtn" onclick="bulkPriceChange(-100)">-100円</button>
      <button class="pbtn" onclick="bulkPriceChange('cart')">カート価格</button>
      <button class="pbtn" onclick="bulkPriceChange('custom')">任意</button>
      <button class="pbtn danger" onclick="clearBulkSelection()">解除</button>
    </div>
  </div>
  <div class="filter">
    <button class="fbtn active" data-f="all" onclick="setFilter('all')">全て</button>
    <button class="fbtn" data-f="lost" onclick="setFilter('lost')">❌喪失</button>
    <button class="fbtn" data-f="got" onclick="setFilter('got')">✅獲得</button>
  </div>
  <div class="list" id="list"></div>
</div>

<div id="empty" class="empty">
  👆 上にSKUを入力して「チェック」を押してください
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <button class="modal-close" onclick="closeSelector()">✕</button>
      <h2>📋 SKU一覧から選択</h2>
    </div>
    <div class="update-info" id="updateInfo" style="display:none"></div>
    <div class="modal-controls">
      <input type="text" class="modal-search" id="searchInput" placeholder="🔍 SKU・ASIN・商品名で検索" oninput="renderSkuList()">
      <div class="modal-counter">
        <span>選択中: <span class="counter-val" id="counter">0/20</span></span>
        <span id="filterCount"></span>
      </div>
      <div class="filter" style="padding:0">
        <button class="fbtn active" data-ch="ALL" onclick="setChannel('ALL')">全て</button>
        <button class="fbtn" data-ch="FBA" onclick="setChannel('FBA')">FBA</button>
        <button class="fbtn" data-ch="FBM" onclick="setChannel('FBM')">自己発送</button>
      </div>
    </div>
    <div class="modal-list" id="modalList">
      <div class="loading">⏳ 読み込み中...</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeSelector()">キャンセル</button>
      <button class="btn btn-primary" id="applyBtn" onclick="applySelection()">✅ 追加</button>
    </div>
  </div>
</div>

<div class="dialog-overlay" id="dialog">
  <div class="dialog">
    <h3 id="dialogTitle">価格変更の確認</h3>
    <div class="dialog-body" id="dialogBody"></div>
    <div class="dialog-row">
      <button class="btn btn-secondary" onclick="closeDialog()">キャンセル</button>
      <button class="btn btn-danger" id="dialogConfirm">実行</button>
    </div>
  </div>
</div>

<script>
const MAX_SKUS = 20;
const COOLDOWN_SEC = 90;
const UPDATE_KEY = 'lastSkuUpdate';
const PRICE_WARN_RATIO = 0.3;
const BULK_CONCURRENCY = 3;

let results = [];
let currentFilter = 'all';
let skuData = { items: [], updated: null };
let selectedSkus = new Set();
let currentChannel = 'ALL';
let cooldownTimer = null;
let bulkSelection = new Set();

window.addEventListener('load', () => {
  const saved = localStorage.getItem('skus');
  if (saved) {
    document.getElementById('skuInput').value = saved;
    updateInputInfo();
  }
  updateCooldownDisplay();
  document.getElementById('skuInput').addEventListener('input', updateInputInfo);
});

function updateInputInfo() {
  const text = document.getElementById('skuInput').value;
  const count = text.split('\n').map(s => s.trim()).filter(s => s).length;
  const info = document.getElementById('inputInfo');
  if (count > MAX_SKUS) {
    info.innerHTML = `<span style="color:#dc3545;font-weight:700">${count}件（最大${MAX_SKUS}件まで）</span>`;
  } else {
    info.textContent = `SKUを1行ずつ入力(${count}/${MAX_SKUS}件)`;
  }
}

function saveSKUs() {
  localStorage.setItem('skus', document.getElementById('skuInput').value);
  toast('💾 保存しました');
}

async function check() {
  const text = document.getElementById('skuInput').value.trim();
  if (!text) { alert('SKUを入力してください'); return; }
  const skus = text.split('\n').map(s => s.trim()).filter(s => s);
  if (skus.length > MAX_SKUS) { alert(`一度に${MAX_SKUS}件まで`); return; }

  const btn = document.getElementById('checkBtn');
  btn.disabled = true;
  btn.textContent = '取得中...';
  document.getElementById('empty').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('list').innerHTML = '<div class="loading">⏳ 取得中...</div>';
  document.getElementById('summary').innerHTML = '取得中...';
  bulkSelection.clear();
  updateBulkBar();

  try {
    const res = await fetch('/api/check', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ skus })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    results = data;
    render();
  } catch (e) {
    document.getElementById('list').innerHTML = `<div class="loading">❌ ${e.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '🔍 チェック';
  }
}

function render() {
  const stats = {total: 0, got: 0, lost: 0, error: 0};
  results.forEach(r => {
    stats.total++;
    if (r.status === 'error') stats.error++;
    else if (r.hasBuyBox) stats.got++;
    else stats.lost++;
  });
  document.getElementById('summary').innerHTML = `
    <div class="sum-row">
      <span class="sum-item">全${stats.total}品</span>
      <span class="sum-item got">✅獲得${stats.got}</span>
      <span class="sum-item lost">❌喪失${stats.lost}</span>
      ${stats.error > 0 ? `<span style="color:#999">⚠️エラー${stats.error}</span>` : ''}
    </div>
  `;
  let filtered = results;
  if (currentFilter === 'lost') filtered = results.filter(r => r.status === 'ok' && !r.hasBuyBox);
  else if (currentFilter === 'got') filtered = results.filter(r => r.status === 'ok' && r.hasBuyBox);
  filtered.sort((a, b) => {
    if (a.status === 'error') return 1;
    if (b.status === 'error') return -1;
    if (a.hasBuyBox !== b.hasBuyBox) return a.hasBuyBox ? 1 : -1;
    return (b.diffFromCart || 0) - (a.diffFromCart || 0);
  });
  if (filtered.length === 0) { document.getElementById('list').innerHTML = '<div class="empty">該当なし</div>'; return; }
  document.getElementById('list').innerHTML = filtered.map(r => renderCard(r)).join('');
}

function renderCard(r) {
  if (r.status === 'error') {
    return `<div class="card error" data-sku="${escapeHtml(r.sku)}"><div class="nm">${escapeHtml(r.sku)}</div><div class="meta">⚠️ ${escapeHtml(r.error || '')}</div></div>`;
  }
  const statusClass = r.hasBuyBox ? 'got' : 'lost';
  const statusText = r.hasBuyBox ? '✅獲得中' : '❌喪失';
  const diffCart = r.diffFromCart;
  let diffText = '', diffClass = '';
  if (diffCart !== null && diffCart !== undefined) {
    if (diffCart > 0) { diffText = `カート+${diffCart}円高`; diffClass = 'danger'; }
    else if (diffCart < 0) { diffText = `カート${diffCart}円安`; diffClass = 'ok'; }
    else { diffText = 'カート同額'; diffClass = 'ok'; }
  }
  const isBulkSelected = bulkSelection.has(r.sku);
  const hasCart = r.cartPrice && r.cartPrice > 0;
  return `
    <div class="card ${statusClass}" data-sku="${escapeHtml(r.sku)}">
      <div class="card-head">
        <input type="checkbox" class="card-check" ${isBulkSelected ? 'checked' : ''} onchange="toggleBulk('${escapeHtml(r.sku)}', this)">
        <div class="card-body">
          <div class="nm">${escapeHtml(r.name || '(名称なし)')}</div>
          <div class="meta">SKU:${escapeHtml(r.sku)} / 競合:${r.competitorCount}名</div>
        </div>
      </div>
      <div class="price-grid">
        <div class="price-cell"><div class="label">自分</div><div class="value">¥${(r.myPrice||0).toLocaleString()}</div></div>
        <div class="price-cell"><div class="label">カート</div><div class="value">${r.cartPrice ? '¥'+r.cartPrice.toLocaleString() : '-'}</div></div>
        <div class="price-cell"><div class="label">最安</div><div class="value">${r.lowestPrice ? '¥'+r.lowestPrice.toLocaleString() : '-'}</div></div>
      </div>
      <div class="status-row">
        <span class="diff ${diffClass}">${diffText}</span>
        <span class="status-badge ${statusClass}">${statusText}</span>
      </div>
      <div class="price-edit">
        <div class="price-edit-label">💰 価格変更</div>
        <div class="price-edit-row">
          <button class="pbtn" onclick="askPriceChange('${escapeHtml(r.sku)}', -50)">-50円</button>
          <button class="pbtn" onclick="askPriceChange('${escapeHtml(r.sku)}', -100)">-100円</button>
          <button class="pbtn" onclick="askPriceChange('${escapeHtml(r.sku)}', 'cart')" ${!hasCart ? 'disabled' : ''}>カート価格</button>
          <button class="pbtn" onclick="askPriceChange('${escapeHtml(r.sku)}', 'custom')">任意</button>
        </div>
        <div class="update-status" id="status-${escapeHtml(r.sku)}" style="display:none"></div>
      </div>
    </div>
  `;
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter .fbtn[data-f]').forEach(b => b.classList.toggle('active', b.dataset.f === f));
  render();
}

function askPriceChange(sku, option) {
  const r = results.find(x => x.sku === sku);
  if (!r) { toast('⚠️ 対象SKUが見つかりません'); return; }
  const current = r.myPrice || 0;
  let newPrice = 0;
  let label = '';
  if (option === -50) { newPrice = current - 50; label = '-50円'; }
  else if (option === -100) { newPrice = current - 100; label = '-100円'; }
  else if (option === 'cart') {
    if (!r.cartPrice) { toast('⚠️ カート価格が取得できていません'); return; }
    newPrice = r.cartPrice; label = 'カート価格に合わせる';
  }
  else if (option === 'custom') { showCustomPriceDialog(sku, current); return; }
  showPriceConfirmDialog([{ sku, oldPrice: current, newPrice, name: r.name }], label);
}

function showCustomPriceDialog(sku, current) {
  const r = results.find(x => x.sku === sku);
  document.getElementById('dialogTitle').textContent = '任意価格を入力';
  document.getElementById('dialogBody').innerHTML = `
    <div>SKU: <strong>${escapeHtml(sku)}</strong></div>
    <div>現在価格: ¥${current.toLocaleString()}</div>
    <input type="number" class="dialog-input" id="customPriceInput" placeholder="新しい価格（円）" min="1" max="9999999">
  `;
  document.getElementById('dialogConfirm').textContent = '確認';
  document.getElementById('dialogConfirm').onclick = () => {
    const v = parseInt(document.getElementById('customPriceInput').value, 10);
    if (!v || v <= 0) { toast('⚠️ 正しい価格を入力'); return; }
    closeDialog();
    showPriceConfirmDialog([{ sku, oldPrice: current, newPrice: v, name: r.name }], `¥${v.toLocaleString()}`);
  };
  openDialog();
  setTimeout(() => document.getElementById('customPriceInput').focus(), 100);
}

function showPriceConfirmDialog(items, label) {
  const warns = items.filter(x => x.newPrice < x.oldPrice * PRICE_WARN_RATIO);
  const invalids = items.filter(x => x.newPrice <= 0);
  if (invalids.length > 0) { toast(`⚠️ ${invalids.length}件が0円以下。中止`); return; }
  const isBulk = items.length > 1;
  document.getElementById('dialogTitle').textContent = isBulk ? `一括価格変更 (${items.length}件)` : '価格変更の確認';
  let html = '';
  if (isBulk) {
    html = `
      <div>変更内容: <strong>${escapeHtml(label)}</strong></div>
      <div style="max-height:200px;overflow-y:auto;margin:10px 0;font-size:12px">
        ${items.map(x => `<div style="padding:4px 0;border-bottom:1px solid #eee">${escapeHtml(x.sku)}: ¥${x.oldPrice.toLocaleString()} → <strong style="color:#dc3545">¥${x.newPrice.toLocaleString()}</strong></div>`).join('')}
      </div>
    `;
  } else {
    const x = items[0];
    html = `
      <div>SKU: <strong>${escapeHtml(x.sku)}</strong></div>
      <div style="font-size:12px;color:#666;margin:4px 0">${escapeHtml((x.name||'').substring(0,40))}</div>
      <div class="diff-preview">
        <span class="old">¥${x.oldPrice.toLocaleString()}</span>
        <span class="new">¥${x.newPrice.toLocaleString()}</span>
      </div>
    `;
  }
  if (warns.length > 0) html += `<div class="dialog-warn">⚠️ ${warns.length}件が現在価格の30%以下。本当に実行しますか？</div>`;
  document.getElementById('dialogBody').innerHTML = html;
  document.getElementById('dialogConfirm').textContent = '実行';
  document.getElementById('dialogConfirm').onclick = async () => { closeDialog(); await executePriceChange(items); };
  openDialog();
}

async function executePriceChange(items) {
  items.forEach(x => {
    const card = document.querySelector(`.card[data-sku="${CSS.escape(x.sku)}"]`);
    if (card) card.classList.add('updating');
    const st = document.getElementById(`status-${x.sku}`);
    if (st) { st.style.display = 'block'; st.className = 'update-status pending'; st.textContent = '⏳ 変更中...'; }
  });
  const queue = [...items];
  const results2 = [];
  const workers = Array(Math.min(BULK_CONCURRENCY, queue.length)).fill(null).map(async () => {
    while (queue.length > 0) {
      const x = queue.shift();
      try {
        const res = await fetch('/api/price-update', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ sku: x.sku, newPrice: x.newPrice })
        });
        const data = await res.json();
        results2.push({ ...x, ...data });
        const st = document.getElementById(`status-${x.sku}`);
        if (st) {
          if (data.ok) { st.className = 'update-status ok'; st.textContent = `✅ 変更受付 (¥${x.newPrice.toLocaleString()})`; }
          else { st.className = 'update-status err'; st.textContent = `❌ ${(data.error || 'エラー').substring(0, 60)}`; }
        }
      } catch (e) {
        results2.push({ ...x, ok: false, error: e.message });
        const st = document.getElementById(`status-${x.sku}`);
        if (st) { st.className = 'update-status err'; st.textContent = `❌ ${e.message}`; }
      }
    }
  });
  await Promise.all(workers);
  items.forEach(x => {
    const card = document.querySelector(`.card[data-sku="${CSS.escape(x.sku)}"]`);
    if (card) card.classList.remove('updating');
  });
  const okCount = results2.filter(r => r.ok).length;
  const errCount = results2.length - okCount;
  toast(`完了: ✅${okCount}件 ❌${errCount}件`);
  const okSkus = results2.filter(r => r.ok).map(r => r.sku);
  if (okSkus.length > 0) setTimeout(() => recheckSkus(okSkus), 5000);
  bulkSelection.clear();
  updateBulkBar();
}

async function recheckSkus(skus) {
  try {
    const res = await fetch('/api/check', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ skus })
    });
    const data = await res.json();
    if (data.error) return;
    data.forEach(newR => {
      const idx = results.findIndex(r => r.sku === newR.sku);
      if (idx >= 0) results[idx] = newR;
    });
    render();
    toast('🔄 再チェック完了');
  } catch (e) { toast('⚠️ 再チェック失敗: ' + e.message); }
}

function toggleBulk(sku, cb) {
  if (cb.checked) bulkSelection.add(sku);
  else bulkSelection.delete(sku);
  updateBulkBar();
}

function updateBulkBar() {
  const bar = document.getElementById('bulkBar');
  const count = bulkSelection.size;
  document.getElementById('bulkCount').textContent = count;
  bar.classList.toggle('show', count > 0);
}

function clearBulkSelection() {
  bulkSelection.clear();
  document.querySelectorAll('.card-check').forEach(cb => cb.checked = false);
  updateBulkBar();
}

function bulkPriceChange(option) {
  if (bulkSelection.size === 0) { toast('⚠️ SKUを選択してください'); return; }
  const targets = Array.from(bulkSelection).map(sku => results.find(r => r.sku === sku)).filter(r => r && r.status === 'ok');
  if (targets.length === 0) { toast('⚠️ 有効なSKUなし'); return; }
  if (option === 'custom') {
    document.getElementById('dialogTitle').textContent = '一括任意価格入力';
    document.getElementById('dialogBody').innerHTML = `
      <div>${targets.length}件を同じ価格に変更します</div>
      <input type="number" class="dialog-input" id="customBulkInput" placeholder="新しい価格（円）" min="1" max="9999999">
    `;
    document.getElementById('dialogConfirm').textContent = '確認';
    document.getElementById('dialogConfirm').onclick = () => {
      const v = parseInt(document.getElementById('customBulkInput').value, 10);
      if (!v || v <= 0) { toast('⚠️ 正しい価格を入力'); return; }
      closeDialog();
      const items = targets.map(r => ({ sku: r.sku, oldPrice: r.myPrice, newPrice: v, name: r.name }));
      showPriceConfirmDialog(items, `¥${v.toLocaleString()}`);
    };
    openDialog();
    setTimeout(() => document.getElementById('customBulkInput').focus(), 100);
    return;
  }
  let items = [];
  let label = '';
  if (option === -50) { items = targets.map(r => ({ sku: r.sku, oldPrice: r.myPrice, newPrice: r.myPrice - 50, name: r.name })); label = '-50円'; }
  else if (option === -100) { items = targets.map(r => ({ sku: r.sku, oldPrice: r.myPrice, newPrice: r.myPrice - 100, name: r.name })); label = '-100円'; }
  else if (option === 'cart') {
    const withCart = targets.filter(r => r.cartPrice);
    if (withCart.length === 0) { toast('⚠️ カート価格取得済み商品なし'); return; }
    items = withCart.map(r => ({ sku: r.sku, oldPrice: r.myPrice, newPrice: r.cartPrice, name: r.name }));
    label = 'カート価格に合わせる';
    if (withCart.length < targets.length) toast(`⚠️ カート不明の${targets.length - withCart.length}件はスキップ`);
  }
  showPriceConfirmDialog(items, label);
}

function openDialog() { document.getElementById('dialog').classList.add('show'); }
function closeDialog() { document.getElementById('dialog').classList.remove('show'); }

async function updateSkuList() {
  const remain = getCooldownRemain();
  if (remain > 0) { toast(`⏳ あと${formatSec(remain)}お待ちください`); return; }
  const btn = document.getElementById('updateBtn');
  btn.disabled = true;
  btn.textContent = '📝 レポート生成依頼中...';
  try {
    const createRes = await fetch('/api/report-create', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ reportType: 'ALL' })
    });
    const createData = await createRes.json();
    if (!createData.reportId) throw new Error(createData.error || 'reportId取得失敗');
    const reportId = createData.reportId;
    localStorage.setItem(UPDATE_KEY, Date.now().toString());
    let attempts = 0;
    const maxAttempts = 10;
    while (attempts < maxAttempts) {
      attempts++;
      btn.textContent = `⏳ 生成中... (${attempts}/${maxAttempts})`;
      await sleep(30000);
      const checkRes = await fetch(`/api/report-check?id=${encodeURIComponent(reportId)}`);
      const checkData = await checkRes.json();
      if (checkData.status === 'DONE') { toast(`✅ ${checkData.count}件取得完了`); break; }
      if (checkData.status === 'FAILED') throw new Error(checkData.error || 'レポート生成失敗');
    }
    if (attempts >= maxAttempts) throw new Error('タイムアウト（5分経過）');
  } catch (e) { alert('❌ 更新失敗: ' + e.message); }
  finally { btn.disabled = false; updateCooldownDisplay(); }
}

function getCooldownRemain() {
  const last = parseInt(localStorage.getItem(UPDATE_KEY) || '0', 10);
  if (!last) return 0;
  return Math.max(0, COOLDOWN_SEC - Math.floor((Date.now() - last) / 1000));
}

function formatSec(sec) { const m = Math.floor(sec / 60); const s = sec % 60; return `${m}:${s.toString().padStart(2, '0')}`; }

function updateCooldownDisplay() {
  if (cooldownTimer) clearInterval(cooldownTimer);
  const btn = document.getElementById('updateBtn');
  const tick = () => {
    const remain = getCooldownRemain();
    if (remain > 0) { btn.textContent = `🔄 更新 (残り${formatSec(remain)})`; btn.disabled = true; }
    else {
      btn.textContent = '🔄 SKU一覧を更新'; btn.disabled = false;
      if (cooldownTimer) { clearInterval(cooldownTimer); cooldownTimer = null; }
    }
  };
  tick();
  if (getCooldownRemain() > 0) cooldownTimer = setInterval(tick, 1000);
}

async function openSelector() {
  document.getElementById('modal').classList.add('show');
  selectedSkus = new Set();
  currentChannel = 'ALL';
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('.fbtn[data-ch]').forEach(b => b.classList.toggle('active', b.dataset.ch === 'ALL'));
  document.getElementById('modalList').innerHTML = '<div class="loading">⏳ 読み込み中...</div>';
  const existing = document.getElementById('skuInput').value.split('\n').map(s => s.trim()).filter(s => s);
  existing.forEach(s => selectedSkus.add(s));
  try {
    const res = await fetch('/api/sku-list');
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'SKU一覧取得失敗');
    skuData = data;
    if (data.updated) {
      const d = new Date(data.updated);
      document.getElementById('updateInfo').style.display = 'block';
      document.getElementById('updateInfo').textContent = `📅 最終更新: ${d.toLocaleString('ja-JP')}`;
    }
    renderSkuList();
    updateCounter();
  } catch (e) {
    document.getElementById('modalList').innerHTML = `<div class="loading">❌ ${e.message}<br><br>先に「🔄 SKU一覧を更新」を実行してください</div>`;
  }
}

function closeSelector() { document.getElementById('modal').classList.remove('show'); }

function setChannel(ch) {
  currentChannel = ch;
  document.querySelectorAll('.fbtn[data-ch]').forEach(b => b.classList.toggle('active', b.dataset.ch === ch));
  renderSkuList();
}

function renderSkuList() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let items = skuData.items || [];
  if (currentChannel !== 'ALL') items = items.filter(s => s.channel === currentChannel);
  if (q) items = items.filter(s =>
    (s.sku || '').toLowerCase().includes(q) ||
    (s.asin || '').toLowerCase().includes(q) ||
    (s.name || '').toLowerCase().includes(q)
  );
  document.getElementById('filterCount').textContent = `${items.length}件表示`;
  if (items.length === 0) { document.getElementById('modalList').innerHTML = '<div class="empty">該当なし</div>'; return; }
  const atLimit = selectedSkus.size >= MAX_SKUS;
  document.getElementById('modalList').innerHTML = items.map(s => {
    const isSelected = selectedSkus.has(s.sku);
    const disabled = !isSelected && atLimit;
    const name = (s.name || '(名称なし)').substring(0, 40);
    return `
      <label class="sku-row ${isSelected ? 'selected' : ''} ${disabled ? 'disabled' : ''}">
        <input type="checkbox" class="sku-check" ${isSelected ? 'checked' : ''} ${disabled ? 'disabled' : ''} data-sku="${escapeHtml(s.sku)}" onchange="toggleSku(this)">
        <div class="sku-body">
          <div class="sku-top">
            <span class="sku-code">${escapeHtml(s.sku)}</span>
            <span class="sku-badge ${s.channel}">${s.channel === 'FBA' ? 'FBA' : '自己'}</span>
          </div>
          <div class="sku-name">${escapeHtml(name)}</div>
          <div class="sku-price">¥${(s.price || 0).toLocaleString()}</div>
        </div>
      </label>
    `;
  }).join('');
}

function toggleSku(cb) {
  const sku = cb.dataset.sku;
  if (cb.checked) {
    if (selectedSkus.size >= MAX_SKUS) { cb.checked = false; toast(`⚠️ 最大${MAX_SKUS}件まで`); return; }
    selectedSkus.add(sku);
  } else selectedSkus.delete(sku);
  updateCounter();
  renderSkuList();
}

function updateCounter() {
  const counter = document.getElementById('counter');
  counter.textContent = `${selectedSkus.size}/${MAX_SKUS}`;
  counter.classList.toggle('warn', selectedSkus.size >= MAX_SKUS);
}

function applySelection() {
  if (selectedSkus.size === 0) { toast('⚠️ SKUを選択してください'); return; }
  const skus = Array.from(selectedSkus);
  document.getElementById('skuInput').value = skus.join('\n');
  updateInputInfo();
  closeSelector();
  toast(`✅ ${skus.length}件を適用`);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}
</script>
